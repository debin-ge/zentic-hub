name: github-hub
on: github.issue_comment
max_runtime: 2h
filters:
  repo: debin-ge/zentic-hub
  from_users: [maintainer]
steps:
  - id: work
    environment: hub
    max_runtime: 1h
    idle_timeout: 10m
    agent: codex
    github:
      connection: debin-ge
    prompt:
      - text: ${{ zentic.prompt }}
