name: github-zentic
on: github.issue_comment
max_runtime: 2h
filters:
  repo: getzentic/zentic
  from_users: [maintainer]
steps:
  - id: work
    environment: zentic
    max_runtime: 1h
    idle_timeout: 10m
    agent: codex
    github:
      connection: getzentic
    prompt:
      - text: ${{ zentic.prompt }}
